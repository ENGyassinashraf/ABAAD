# ABAAD uv workspace root. The root is not a package; it only pins the
# Python version range, the workspace members and shared tool groups.
[project]
name = "abaad"
version = "0.1.0"
description = "ABAAD | أبعاد — Earth Analog Discovery Platform (Phase 1 foundation)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "abaad-api",
    "abaad-science",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",
]
# Phase 1 only checks that these install and import on the target Mac and
# uses them for the synthetic map-spike fixtures. No scientific processing.
gis = [
    "numpy==2.5.4",
    "rasterio==1.5.2",
    "shapely==2.2.0",
    "pyproj==3.8.0",
]

[tool.uv]
package = false
default-groups = ["dev", "gis"]

[tool.uv.workspace]
members = ["backend", "science"]

[tool.uv.sources]
abaad-api = { workspace = true }
abaad-science = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["backend/tests", "science/tests", "scripts/tests"]
addopts = "-ra"
