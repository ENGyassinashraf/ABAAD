[project]
name = "abaad-api"
version = "0.1.0"
description = "ABAAD FastAPI service (Phase 1 foundation)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "pydantic==2.14.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abaad_api"]
